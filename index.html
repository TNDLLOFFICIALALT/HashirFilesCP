<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HashirFilesCP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>

  <header>
    <div class="header-inner">
      <h1>HashirFilesCP</h1>
      <p class="tagline">The Consequences Of Hashir Not Investing In Sec-Ops Is Leaking His Dm's</p>
      <p class="description">
        A private collection of screenshots that were never meant to surface if someone had made the right choice.<br />
        Click any image to expand • Use arrow keys in lightbox
      </p>
      <div class="stats">
        <span id="imageCount">0 images</span>
      </div>
    </div>
  </header>

  <main class="gallery" id="gallery"></main>

  <footer>
    <p>HashirFilesCP • Built for the plot</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="nav-btn prev" id="prevBtn" aria-label="Previous">‹</button>
    <button class="nav-btn next" id="nextBtn" aria-label="Next">›</button>
    <button class="close-btn" id="closeBtn" aria-label="Close">×</button>
    
    <div class="lightbox-content">
      <img src="" alt="Expanded image" id="lightboxImg" />
      <div class="lightbox-meta">
        <p class="lightbox-comment" id="lightboxComment"></p>
        <p class="lightbox-counter" id="lightboxCounter"></p>
      </div>
    </div>
  </div>

  <script>
    const items = [
      { src: "IMG_0001.jpg", comment: "weird" },
      { src: "IMG_0002.jpg", comment: "what does bro mean by everywhere" },
      { src: "IMG_0003.jpg", comment: "Let her sleep bro 😭" },
      { src: "IMG_0005.jpg", comment: "what you mean by change dna 🤨" },
      { src: "IMG_0006.jpg", comment: "how are kisses ganna change dna" },
      { src: "IMG_0008.jpg", comment: "no way bro tastes sweet" },
      { src: "IMG_0009.jpg", comment: "that is not tuff tho queen is the best peice in chess" },
      { src: "IMG_0010.jpg", comment: "what does bro mean by \"physical earth\"" },
      { src: "IMG_0011.jpg", comment: "warm each other up is sus 🤨" },
      { src: "IMG_0012.jpg", comment: "How did Toha get involved in this 😭" },
      { src: "IMG_0013.jpg", comment: "bro is begging at this point" }
    ];

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxComment = document.getElementById("lightboxComment");
    const lightboxCounter = document.getElementById("lightboxCounter");
    const closeBtn = document.getElementById("closeBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const imageCount = document.getElementById("imageCount");

    let currentIndex = 0;

    // Update image count
    imageCount.textContent = `${items.length} images`;

    // Build gallery
    items.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "card";
      card.style.animationDelay = `${index * 0.06}s`;

      const img = document.createElement("img");
      img.src = `images/${item.src}`;
      img.alt = item.comment;
      img.loading = "lazy";

      img.addEventListener("click", () => openLightbox(index));

      const comment = document.createElement("p");
      comment.className = "comment";
      comment.textContent = item.comment;

      card.appendChild(img);
      card.appendChild(comment);
      gallery.appendChild(card);
    });

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      document.body.style.overflow = "";
    }

    function updateLightbox() {
      const item = items[currentIndex];
      lightboxImg.src = `images/${item.src}`;
      lightboxComment.textContent = item.comment;
      lightboxCounter.textContent = `${currentIndex + 1} / ${items.length}`;
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + items.length) % items.length;
      updateLightbox();
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % items.length;
      updateLightbox();
    }

    // Events
    closeBtn.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", showPrev);
    nextBtn.addEventListener("click", showNext);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("active")) return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPrev();
      if (e.key === "ArrowRight") showNext();
    });
  </script>
</body>
</html>

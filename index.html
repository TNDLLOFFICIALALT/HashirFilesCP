<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HashirFilesCP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>HashirFilesCP</h1>
    <p>because sec-ops was optional</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <script>
    // ========== PUT YOUR IMAGE FILENAMES HERE ==========
    const images = [
      "image1.jpg",
      "image2.jpg",
      "image3.png",
      "image4.jpg"
      // add more lines like the ones above
    ];
    // ===================================================

    const gallery = document.getElementById("gallery");

    images.forEach(src => {
      const item = document.createElement("div");
      item.className = "item";

      const img = document.createElement("img");
      img.src = `images/${src}`;
      img.alt = src;
      img.loading = "lazy";

      item.appendChild(img);
      gallery.appendChild(item);
    });
  </script>
</body>
</html>

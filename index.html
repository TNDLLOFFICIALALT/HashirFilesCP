<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HashirFilesCP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>HashirFilesCP</h1>
    <p>because sec-ops was optional</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <script>
    const images = [
      "IMG_0001.jpg",
      "IMG_0002.jpg",
      "IMG_0003.jpg",
      "IMG_0005.jpg",
      "IMG_0006.jpg",
      "IMG_0008.jpg",
      "IMG_0009.jpg",
      "IMG_0010.jpg",
      "IMG_0011.jpg",
      "IMG_0012.jpg",
      "IMG_0013.jpg"
    ];

    const gallery = document.getElementById("gallery");

    images.forEach(src => {
      const item = document.createElement("div");
      item.className = "item";

      const img = document.createElement("img");
      img.src = `images/${src}`;
      img.alt = src;
      img.loading = "lazy";

      item.appendChild(img);
      gallery.appendChild(item);
    });
  </script>
</body>
</html>
